title: Knowledge Base
baseurl: "/knowledge-base"

collections:
  courses:
    output: true

defaults:
  - scope:
      path: ""
        # applies to normal pages
    values:
      layout: default

  - scope:
      path: ""
      type: "courses"   
    values:
      layout: default
      
exclude:
  - Ruby40-x64
  - vendor
  - _site
  - .jekyll-cache
  - .sass-cache